<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="nr_fs" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060410">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<title>NEXUS ROYALE</title>
<style>
  html,body{margin:0;height:100%;background:#060410;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;color:#e8e6ff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #game{position:fixed;inset:0;}
  canvas{display:block;}
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="assets_fallback.js?v=100"></script>
<script src="game.js?v=100"></script>
<script>
  if('serviceWorker' in navigator){ window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update();                                   // controlla subito se c'e' una build nuova
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return;
        w.addEventListener('statechange',()=>{        // build nuova pronta -> ricarica una volta sola
          if(w.state==='installed' && navigator.serviceWorker.controller && !sessionStorage.getItem('nr_reloaded')){
            sessionStorage.setItem('nr_reloaded','1'); location.reload(); } }); });
    }).catch(()=>{});
  }); }
</script>
<script>
(function(){ // SCHERMO INTERO: parte al primo tocco/click, una volta sola
  var done=false;
  function go(){ if(done) return; done=true;
    var el=document.documentElement;
    var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    // l'orientamento si puo' bloccare SOLO dopo che il fullscreen e' attivo,
    // altrimenti il browser lancia un errore (innocuo ma finiva nella fascia rossa)
    var lock=function(){ if(!document.fullscreenElement) return;
      if(screen.orientation&&screen.orientation.lock){
        var p=screen.orientation.lock('portrait'); if(p&&p.catch) p.catch(function(){}); } };
    if(fn){ try{ var r=fn.call(el,{navigationUI:'hide'});
        if(r&&r.then) r.then(lock).catch(function(){}); else setTimeout(lock,300);
      }catch(e){ try{ fn.call(el); setTimeout(lock,300); }catch(e2){} } }
  }
  ['pointerdown','touchend','click'].forEach(function(ev){
    window.addEventListener(ev,go,{once:true,passive:true}); });
})();
</script>
<div id="nr_err" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99999;background:#300;color:#ffd;font:12px monospace;padding:10px;white-space:pre-wrap;max-height:60%;overflow:auto"></div>
<script>
(function(){ // mostra a schermo l'errore che blocca il gioco
  function show(m){ var d=document.getElementById('nr_err'); if(!d) return;
    d.style.display='block'; d.textContent=(d.textContent?d.textContent+'\n':'')+m; }
  window.addEventListener('error',function(e){
    show('ERRORE: '+(e.message||'')+'\n@ '+(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno);
  });
  window.addEventListener('unhandledrejection',function(e){ show('PROMISE: '+(e.reason&&e.reason.message||e.reason)); });
})();
</script>
</body>
</html>
